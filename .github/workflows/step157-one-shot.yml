name: Step 157 one-shot U10 raw input patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/step157-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch remaining known U10 raw channels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ecm_core.inc.h')
          s = p.read_text()
          old_vars = '''static bua_u8 sim_timer8;
          static bua_u8 sim_maf_adc = 128u;
          static bua_u8 sim_o2_adc = 128u;
          static bua_u8 sim_cts_adc = 120u;
          static bua_u8 sim_tps_adc = 35u;
          static bua_u8 sim_mat_adc = 0u;
          static bua_u8 sim_diag_adc = 200u;
          '''
          new_vars = '''static bua_u8 sim_timer8;
          static bua_u8 sim_map2_adc = 0u;
          static bua_u8 sim_volt_adc = 128u;
          static bua_u8 sim_o2_adc = 128u;
          static bua_u8 sim_map_adc = 0u;
          static bua_u8 sim_cts_adc = 120u;
          static bua_u8 sim_tps_adc = 35u;
          static bua_u8 sim_pumpvolt_adc = 0u;
          static bua_u8 sim_diag_adc = 200u;
          static bua_u8 sim_mat_adc = 0u;
          static bua_u8 sim_esc_adc = 0u;
          static bua_u8 sim_maf_adc = 128u;
          '''
          old_adc = '''static bua_u8 hw_adc(bua_u8 channel)
          {
              switch (channel & 0xF0u) {
                  case 0x10u: return 128u;
                  case 0x20u: return sim_o2_adc;
                  case 0x40u: return sim_cts_adc;
                  case 0x50u: return sim_tps_adc;
                  case 0x70u: return sim_diag_adc;
                  case 0x80u: return sim_mat_adc;
                  case 0xA0u: return sim_maf_adc;
                  default:    return 0u;
              }
          }
          '''
          new_adc = '''static bua_u8 hw_adc(bua_u8 channel)
          {
              switch (channel & 0xF0u) {
                  case 0x00u: return sim_map2_adc;
                  case 0x10u: return sim_volt_adc;
                  case 0x20u: return sim_o2_adc;
                  case 0x30u: return sim_map_adc;
                  case 0x40u: return sim_cts_adc;
                  case 0x50u: return sim_tps_adc;
                  case 0x60u: return sim_pumpvolt_adc;
                  case 0x70u: return sim_diag_adc;
                  case 0x80u: return sim_mat_adc;
                  case 0x90u: return sim_esc_adc;
                  case 0xA0u: return sim_maf_adc;
                  default:    return 0u;
              }
          }
          '''
          assert s.count(old_vars) == 1, 'raw ADC variable block did not match exactly once'
          assert s.count(old_adc) == 1, 'hw_adc block did not match exactly once'
          s = s.replace(old_vars, new_vars).replace(old_adc, new_adc)
          p.write_text(s)
          PY

      - name: Commit source patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name dldavis007
          git config user.email dldavis007@users.noreply.github.com
          git rm .github/workflows/step157-one-shot.yml
          git add src/ecm_core.inc.h
          git commit -m "Step 157 add remaining known U10 raw ADC backing"
          git push origin HEAD:main
