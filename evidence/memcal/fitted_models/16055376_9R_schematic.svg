<text x="470" y="780" font-size="17" text-anchor="middle">Direct links: Pins 4–5 and Pins 7–9. Pins 8 and 10 are isolated.</text>
<text x="470" y="815" font-size="17" text-anchor="middle">Pins 11–12 form a separate 10 kΩ branch; it connects to no other pin.</text>
<text x="470" y="868" font-size="16" text-anchor="middle">Pin 3 feeds the three lower branches. No package pin is tied to global ground.</text>
